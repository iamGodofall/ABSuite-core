services:
  # ---- Core Infrastructure ----

  absuite-db:
    image: alpine:latest
    container_name: absuite-db
    # Every service runs as the unprivileged `node` user (uid 1000), but this
    # init container is root — so anything it creates is root-owned and the
    # services die with "attempt to write a readonly database". SQLite also
    # writes WAL and journal files beside the database, so the directory has
    # to be writable too, not just the file.
    command: >
      sh -c "mkdir -p /data
      && touch /data/absuite.db
      && chown -R 1000:1000 /data
      && chmod 775 /data
      && chmod 664 /data/absuite.db
      && exec tail -f /dev/null"
    volumes:
      - absuite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/absuite.db"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - absuite-net

  # ---- Module Services ----

  capkit:
    build:
      context: .
      dockerfile: ./packages/capkit/Dockerfile
    container_name: absuite-capkit
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - NODE_ENV=production
      - ABSUITE_DB_PATH=/data/absuite.db
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - CAPKIT_PORT=8081
      - CAPKIT_HMAC_SECRET=${CAPKIT_HMAC_SECRET}
      - CAPKIT_JWT_SECRET=${CAPKIT_JWT_SECRET}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
      - CAPKIT_AUDIT_LOG=${CAPKIT_AUDIT_LOG:-/data/capkit-audit.jsonl}
      # Billing is optional; without this the webhook rejects every call.
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Ed25519 key for signing execution traces. Shared with edge-run so one
      # public key verifies traces from the whole suite. Generated ephemerally
      # if unset, which invalidates prior signatures on restart.
      - CAPKIT_TRACE_PRIVATE_KEY=${CAPKIT_TRACE_PRIVATE_KEY:-}
      - CAPKIT_TRACE_KEY_ID=${CAPKIT_TRACE_KEY_ID:-absuite-trace-key}
      # Public signup mints credentials, so it stays off unless enabled.
      - ABSUITE_SIGNUP_ENABLED=${ABSUITE_SIGNUP_ENABLED:-false}
      - ABSUITE_SIGNUP_PLAN=${ABSUITE_SIGNUP_PLAN:-free}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ABSUITE_ALLOWED_ORIGINS=${ABSUITE_ALLOWED_ORIGINS:-http://localhost:3001}
    volumes:
      - absuite-data:/data
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8081/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - absuite-net

  edge-run:
    build:
      context: .
      dockerfile: ./packages/edge-run/Dockerfile
    container_name: absuite-edge-run
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - NODE_ENV=production
      - ABSUITE_DB_PATH=/data/absuite.db
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - EDGERUN_PORT=8082
      - EDGERUN_MAX_CONCURRENT=${EDGERUN_MAX_CONCURRENT:-10}
      - EDGERUN_QUEUE_LIMIT=${EDGERUN_QUEUE_LIMIT:-100}
      # Script execution stays off unless an operator opts in explicitly.
      - EDGERUN_SCRIPT_ROOT=${EDGERUN_SCRIPT_ROOT:-}
      - EDGERUN_ALLOWED_HOSTS=${EDGERUN_ALLOWED_HOSTS:-}
      # Shared with CapKit so this service can validate capability tokens
      # and sign execution traces with the same key.
      - CAPKIT_HMAC_SECRET=${CAPKIT_HMAC_SECRET}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
      - CAPKIT_TRACE_PRIVATE_KEY=${CAPKIT_TRACE_PRIVATE_KEY:-}
      - CAPKIT_TRACE_KEY_ID=${CAPKIT_TRACE_KEY_ID:-absuite-trace-key}
    volumes:
      - absuite-data:/data
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8082/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - absuite-net

  quickbench:
    build:
      context: .
      dockerfile: ./packages/quickbench/Dockerfile
    container_name: absuite-quickbench
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - NODE_ENV=production
      - PORT=8083
      - QUICKBENCH_PORT=8083
      - QUICKBENCH_OLLAMA_URL=${QUICKBENCH_OLLAMA_URL:-http://host.docker.internal:11434}
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CAPKIT_HMAC_SECRET=${CAPKIT_HMAC_SECRET}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
      - ABSUITE_DB_PATH=/data/absuite.db
    volumes:
      - absuite-data:/data
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8083/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - absuite-net

  connector-starter:
    build:
      context: .
      dockerfile: ./packages/connector-starter/Dockerfile
    container_name: absuite-connector-starter
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - NODE_ENV=production
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - CONNECTOR_STARTER_PORT=8084
      - CAPKIT_HMAC_SECRET=${CAPKIT_HMAC_SECRET}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
      - ABSUITE_DB_PATH=/data/absuite.db
      # Connector credentials — all optional; each connector reports its own state.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
    volumes:
      - absuite-data:/data
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8084/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - absuite-net

  trust:
    build:
      context: .
      dockerfile: ./packages/trust/Dockerfile
    container_name: absuite-trust
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - NODE_ENV=production
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - TRUST_PORT=8085
      - ABSUITE_DB_PATH=/data/absuite.db
      - CAPKIT_HMAC_SECRET=${CAPKIT_HMAC_SECRET}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
      # Scoring people is an employee-monitoring capability with legal
      # obligations attached. It stays off unless a deployment opts in.
      - ABSUITE_TRUST_SCORE_HUMANS=${ABSUITE_TRUST_SCORE_HUMANS:-false}
    volumes:
      - absuite-data:/data
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8085/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - absuite-net

  # ---- Dashboard ----

  dashboard:
    build:
      context: .
      dockerfile: ./packages/dashboard-ui/Dockerfile
    container_name: absuite-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ABSUITE_LOG_LEVEL=${ABSUITE_LOG_LEVEL:-info}
      - ABSUITE_ALLOWED_ORIGINS=${ABSUITE_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      - ABSUITE_ADMIN_API_KEY=${ABSUITE_ADMIN_API_KEY:-}
      - CAPKIT_ADMIN_KEY=${CAPKIT_ADMIN_KEY:-${ABSUITE_ADMIN_API_KEY:-}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    depends_on:
      absuite-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - absuite-net

  # ---- Persistent Volume ----

volumes:
  absuite-data:
    driver: local

networks:
  absuite-net:
    driver: bridge
