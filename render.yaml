# Render — the same instance, for a host that wants a blueprint instead of a CLI.
#
# One service, because deploy/Dockerfile already contains all six. Connect the
# repository as a Blueprint and Render reads this file; nothing is typed into a
# web form, so what is deployed is what is in git.

services:
  - type: web
    name: absuite
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ABSUITE_DB_PATH
        value: /data/absuite.db
      # Generated once by Render and never printed in a build log. Read it from
      # the dashboard's Environment tab; the username is `absuite`.
      - key: ABSUITE_PUBLIC_PASSWORD
        generateValue: true
      # Mints capability tokens.
      - key: CAPKIT_ADMIN_KEY
        generateValue: true
      # Reads the record. Twenty-eight routes sit behind it; without it the
      # instance is healthy and reports UNKNOWN for everything.
      - key: ABSUITE_ADMIN_API_KEY
        generateValue: true
      # capkit refuses to start without this when NODE_ENV=production.
      - key: CAPKIT_HMAC_SECRET
        generateValue: true
      # Signs execution traces. NOT generated here: it is an Ed25519 private
      # key, it has structure, and it must stay the same forever — a new one
      # makes every existing record fail verification. Generate it once with
      # `node scripts/gen-deploy-secrets.mjs` and paste it in.
      - key: CAPKIT_TRACE_PRIVATE_KEY
        sync: false
      - key: CAPKIT_TRACE_KEY_ID
        sync: false
    disk:
      name: absuite-data
      mountPath: /data
      sizeGB: 1
