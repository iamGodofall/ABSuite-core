name: Publish to npm

# Manual only. Publishing is irreversible — npm does not allow re-using a
# version number — so this never fires on a push by accident.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack, publish nothing)'
        type: boolean
        default: true
      scope:
        description: 'npm scope, e.g. @absuite or @your-username. Leave blank to keep the current one.'
        type: string
        required: false

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance — publishes a signed, verifiable record of
      # exactly which commit and workflow produced each tarball. Fitting for a
      # project whose whole premise is provable execution.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # node:sqlite requires 22.5+. Pinning the major avoids a surprise upgrade
      # changing behaviour under us.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Fail in seconds on a credential problem rather than after a full
      # build-and-test cycle. npm rejects a token that cannot bypass 2FA only
      # at the final upload, which is two minutes of work in and a confusing
      # place to discover an auth issue.
      - name: Check the npm token before doing any work
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! whoami_out=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: ${whoami_out}"
            echo "The token must be able to publish without an interactive 2FA prompt." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Use either:" >> "$GITHUB_STEP_SUMMARY"
            echo "- a **Classic token** of type **Automation**, or" >> "$GITHUB_STEP_SUMMARY"
            echo "- a **Granular access token** with **Bypass 2FA enabled** and read/write on the target scope." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Authenticated to npm as: ${whoami_out}"
          echo "Authenticated to npm as \`${whoami_out}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Change scope
        if: inputs.scope != ''
        run: node scripts/set-scope.mjs "${{ inputs.scope }}" && pnpm install --no-frozen-lockfile

      # Build before test. Six of the seven packages import @absuitecore/capkit,
      # which resolves to its dist/ — so running the suite first fails to load
      # those files entirely: 7 suites "failed" with 266 passed and 0 failed,
      # because they never ran.
      - name: Build
        run: pnpm -r --filter "./packages/*" build

      - name: Test
        run: pnpm test

      - name: Show what would be published
        run: |
          for p in capkit trust edge-run quickbench connector-starter mcp cli; do
            echo "--- $p ---"
            (cd "packages/$p" && pnpm pack --pack-destination /tmp/preview 2>&1 | tail -1)
          done

      # Every other package depends on capkit via "workspace:*", which npm
      # cannot resolve — `npm publish` would ship that string verbatim and
      # every install would die on `Unsupported URL Type "workspace:"`. pnpm
      # rewrites it to the real version in the tarball. This check fails the
      # run before anything reaches the registry, because an npm version can
      # never be republished and a broken one is permanent.
      - name: Verify no workspace protocol survives packing
        run: |
          set -e
          for p in capkit trust edge-run quickbench connector-starter mcp cli; do
            packed=$(cd "packages/$p" && pnpm pack --pack-destination /tmp/verify 2>/dev/null | tail -1)
            if tar -xzOf "$packed" package/package.json | grep -q 'workspace:'; then
              echo "::error::$p would publish an unresolvable workspace: dependency"
              exit 1
            fi
            echo "  $p: dependencies resolved"
          done

      - name: Publish
        if: inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -e
          # CapKit first — every other package depends on it, and npm resolves
          # dependencies at install time against what is actually on the
          # registry.
          for p in capkit trust edge-run quickbench connector-starter mcp cli; do
            echo "Publishing $p..."
            (cd "packages/$p" && pnpm publish --access public --no-git-checks --provenance) || {
              echo "::error::Failed to publish $p"
              exit 1
            }
          done

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Dry run complete"
              echo ""
              echo "Nothing was published. Re-run with **Dry run unchecked** to publish for real."
            else
              echo "### Published"
              echo ""
              for p in capkit trust edge-run quickbench connector-starter mcp cli; do
                echo "- \`$(node -e "process.stdout.write(require('./packages/$p/package.json').name)")\`"
              done
              echo ""
              echo "Verify: \`npm view <package-name>\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
