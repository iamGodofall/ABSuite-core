name: CD - Build and Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run linter
      run: pnpm lint
    
    - name: Build packages
      run: pnpm build

    # `pnpm test --coverage` fails instantly: pnpm parses --coverage itself and
    # rejects it as an unknown option, so the tests never ran. Coverage belongs
    # to jest, which the dedicated script invokes directly.
    - name: Run tests
      run: pnpm test

    - name: Coverage
      run: pnpm test:coverage

    # Never block the pipeline on a third-party uploader. A coverage service
    # being down is not a reason to call the build broken.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      continue-on-error: true
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Dashboard
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/dashboard-ui/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-dashboard:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push CapKit
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/capkit/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-capkit:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Edge-Run
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/edge-run/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-edge-run:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push QuickBench
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/quickbench/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-quickbench:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Connector
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/connector-starter/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-connector:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Trust
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/trust/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/absuite-trust:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-guard:
    name: Are deployment credentials configured?
    needs: build
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # Without AWS credentials and a cluster, the deploy jobs fail on every
      # push and turn the whole pipeline red for a reason that has nothing to
      # do with the code. A red badge nobody trusts is worse than no badge:
      # people stop reading it, and then it cannot warn them about anything.
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS credentials are not set; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-staging:
    needs: [build, deploy-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.deploy-guard.outputs.configured == 'true'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name absuite-staging
    
    - name: Deploy to Staging
      run: |
        helm upgrade --install absuite ./helm-chart \
          --namespace absuite-staging \
          --set absuite.domain=staging.absuite.dev \
          --set dashboard.image.tag=${{ github.sha }} \
          --set capkit.image.tag=${{ github.sha }} \
          --set edgeRun.image.tag=${{ github.sha }} \
          --set quickbench.image.tag=${{ github.sha }} \
          --set connector.image.tag=${{ github.sha }} \
          --wait \
          --timeout 10m

  deploy-production:
    needs: [deploy-staging, deploy-guard]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.deploy-guard.outputs.configured == 'true'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name absuite-production
    
    - name: Deploy to Production
      run: |
        helm upgrade --install absuite ./helm-chart \
          --namespace absuite \
          --set absuite.domain=absuite.dev \
          --set dashboard.image.tag=${{ github.sha }} \
          --set capkit.image.tag=${{ github.sha }} \
          --set edgeRun.image.tag=${{ github.sha }} \
          --set quickbench.image.tag=${{ github.sha }} \
          --set connector.image.tag=${{ github.sha }} \
          --set absuite.ai.openai.enabled=true \
          --set absuite.ai.openai.apiKey=${{ secrets.OPENAI_API_KEY }} \
          --set absuite.security.jwtSecret=${{ secrets.JWT_SECRET }} \
          --set absuite.security.hmacSecret=${{ secrets.HMAC_SECRET }} \
          --wait \
          --timeout 10m
    
    - name: Run smoke tests
      run: |
        kubectl run smoke-test --rm -i --restart=Never \
          --image=curlimages/curl:latest \
          -- curl -f http://absuite.dev/health
    
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: 'ABSuite ${{ github.ref }} deployed to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
