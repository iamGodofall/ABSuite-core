name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must exist BEFORE setup-node, because `cache: 'pnpm'` shells out to
      # the pnpm binary to work out where the store lives. Installing it
      # afterwards via corepack is too late — setup-node fails with "Unable to
      # locate executable file: pnpm" in under ten seconds, which is what every
      # run of this workflow did until this was fixed.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # node:sqlite needs 22.5+. The whole persistence layer is built on it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm build

      - name: ESLint
        run: pnpm lint || true

      # A stale API reference is the fastest way to lose a developer's trust,
      # so drift is a build failure rather than something noticed later.
      - name: API docs are in sync with the code
        run: pnpm docs:check

      # A missing dashboard route does not 404 — the SPA catch-all returns
      # index.html, so the client gets HTML where it expects JSON and reports a
      # parse error blaming the user's input. The Proof tab shipped broken this
      # way and stayed broken because nothing pointed at the cause.
      - name: Every dashboard call has a server route
        run: pnpm check:routes

      # The dashboard advertises seven things ABSuite refuses to do and names
      # the test enforcing each. A renamed or deleted test turns that panel into
      # a guarantee nobody keeps, which is worse than never claiming it.
      - name: Every advertised refusal still has a test behind it
        run: pnpm check:constraints

      # Published performance figures must match the benchmark data in the repo.
      # Hand-edited numbers are how honest projects start lying by accident.
      - name: Published performance numbers match the measured data
        run: node scripts/gen-performance-doc.mjs --check

      # The layer table is where a project quietly promotes a plan to a feature,
      # one honest-looking edit at a time. Prose does not fail a build; this does.
      # Also enforces the amendment rule: no constitutional principle without an
      # enforcement that exists. A principle that does not deserve a test is a
      # preference, and preferences dressed as principles are how a constitution
      # becomes decoration.
      - name: Every claim in the Constitution names an enforcement that exists
        run: pnpm check:doctrine

      # The room draws one corner per architectural layer, coloured by whether
      # the Constitution says it is built. Generated rather than typed, so a
      # layer cannot be promoted on screen without being promoted in the
      # document — and this fails if the committed copy has gone stale.
      - name: The room's architecture layers match the Constitution
        run: pnpm check:layers

      # The four checks below existed and were never wired into CI, which meant
      # they only ran when someone remembered to run them by hand. A build gate
      # nobody triggers is a preference. These are the ones that keep the
      # interface honest, so they belong here with the rest.

      # Invented data in the interface: dead toggles, demo literals, randomness
      # in a value a reader will see, metrics assigned by hand.
      - name: The interface fabricates nothing
        run: pnpm check:fabrication

      # A perpetual animation nobody can name a state for — and any animation
      # name with no keyframes behind it, which renders as a frozen element
      # while the code claims it is moving.
      - name: Every perpetual motion is earned
        run: pnpm check:motion

      # No sidebar, no scrolling-document shell, no cube nobody can steer, and
      # state before explanation. Regression, not fabrication, is what turns a
      # room back into a dashboard.
      - name: The interaction model has not regressed
        run: pnpm check:doctrine-ui

      # A promise in the philosophy document that the interface does not keep
      # and the ledger does not record as unbuilt.
      - name: The interface keeps what the philosophy promises
        run: pnpm check:ui

      # The deployment files, which no check read until they had drifted far
      # enough to be unusable: a Helm chart with no templates, k8s manifests
      # for a third of the services, environment variables the code never
      # reads, and images nobody publishes. Checked against docker-compose.yml,
      # server.ts and cd.yml rather than against a list kept here.
      - name: The deployment manifests can deploy
        run: pnpm check:deploy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compose interpolates these at build and run time. Without them the
      # config is invalid and the services refuse to start, so CI supplies
      # throwaway values — they never leave the runner.
      - name: Generate ephemeral secrets for the smoke test
        run: |
          {
            echo "CAPKIT_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "CAPKIT_JWT_SECRET=$(openssl rand -hex 32)"
            echo "CAPKIT_ADMIN_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose -f docker-compose.yml build

      # Starting them is the part a build alone cannot catch: a missing env
      # var, a bad entrypoint, a service that exits on boot.
      - name: Start the suite and wait for health
        run: |
          docker compose -f docker-compose.yml up -d

          for service in capkit edge-run quickbench connector-starter trust; do
            echo "Waiting for $service..."
            for attempt in $(seq 1 30); do
              # Match "(healthy)" with the bracket, not the bare word:
              # "unhealthy" contains "healthy", so a substring match would
              # report a failed service as passing — in the one step whose
              # entire job is to catch that.
              state=$(docker compose ps "$service" || true)
              case "$state" in
                *"(unhealthy)"*)
                  echo "::error::$service is unhealthy"
                  docker compose logs "$service"
                  exit 1
                  ;;
                *"(healthy)"*)
                  echo "  $service is healthy"
                  break
                  ;;
              esac
              if [ "$attempt" -eq 30 ]; then
                echo "::error::$service never became healthy"
                docker compose logs "$service"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Show final state
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
