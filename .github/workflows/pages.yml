name: Publish the verifier

# The browser verifier is the shortest path from "interesting claim" to
# "I checked it myself" — no install, no account, no server, no trust in this
# project. Hosting it turns the pitch into a link.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress; let it finish and queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN cannot create a Pages site — that needs admin scope the
      # default token does not carry, and `enablement: true` fails with
      # "Resource not accessible by integration". Pages has to be switched on
      # once by a repository admin; after that this workflow owns every deploy.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain if Pages is not enabled yet
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          {
            echo "### GitHub Pages needs enabling once"
            echo ""
            echo "Settings → Pages → **Build and deployment** → Source → **GitHub Actions**"
            echo ""
            echo "That is the only manual step. Re-run this workflow afterwards and"
            echo "every future deploy is automatic."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Publish an explicit list, not all of docs/.
      #
      # `cp -r docs/*` put the strategy folder on the public web — pricing
      # tiers, competitor analysis, launch planning — at guessable URLs, which
      # is a different thing from those files sitting in a repository someone
      # has to go looking through. They stay in git; they are not part of the
      # site. Anything new is opted in here deliberately.
      # Publish an explicit list, not all of docs/.
      #
      # `cp -r docs/*` put the strategy folder on the public web — pricing
      # tiers, competitor analysis, launch planning — at guessable URLs, which
      # is a different thing from those files sitting in a repository someone
      # has to go looking through. They stay in git; they are not part of the
      # site. Anything new is opted in here deliberately.
      #
      # index.html and system.html are generated by scripts/gen-site.mjs and
      # scripts/gen-system-map.mjs and checked by `pnpm verify`, so the landing
      # page is a reviewable file rather than a heredoc nobody could edit.
      - name: Build the site
        run: |
          mkdir -p _site
          cp docs/index.html    _site/
          cp docs/system.html   _site/
          cp docs/verify.html   _site/
          cp docs/GUIDE.md       _site/
          cp docs/SERVICES.md    _site/
          cp docs/CONSTITUTION.md _site/
          cp docs/API.md        _site/
          # Machine-readable, so it can be imported straight into a client.
          cp docs/openapi.yaml  _site/
          cp docs/ARCHITECTURE.md _site/
          cp docs/SECURITY-MODEL.md _site/
          cp PRINCIPLES.md      _site/
          cp GETTING-STARTED.md _site/
          cp README.md          _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
