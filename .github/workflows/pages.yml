name: Publish the verifier

# The browser verifier is the shortest path from "interesting claim" to
# "I checked it myself" — no install, no account, no server, no trust in this
# project. Hosting it turns the pitch into a link.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress; let it finish and queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN cannot create a Pages site — that needs admin scope the
      # default token does not carry, and `enablement: true` fails with
      # "Resource not accessible by integration". Pages has to be switched on
      # once by a repository admin; after that this workflow owns every deploy.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain if Pages is not enabled yet
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          {
            echo "### GitHub Pages needs enabling once"
            echo ""
            echo "Settings → Pages → **Build and deployment** → Source → **GitHub Actions**"
            echo ""
            echo "That is the only manual step. Re-run this workflow afterwards and"
            echo "every future deploy is automatic."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Publish an explicit list, not all of docs/.
      #
      # `cp -r docs/*` put the strategy folder on the public web — pricing
      # tiers, competitor analysis, launch planning — at guessable URLs, which
      # is a different thing from those files sitting in a repository someone
      # has to go looking through. They stay in git; they are not part of the
      # site. Anything new is opted in here deliberately.
      - name: Build the site
        run: |
          mkdir -p _site
          cp docs/verify.html   _site/
          cp docs/API.md        _site/
          # Machine-readable, so it can be imported straight into a client.
          cp docs/openapi.yaml  _site/
          cp docs/ARCHITECTURE.md _site/
          cp docs/SECURITY-MODEL.md _site/
          cp PRINCIPLES.md      _site/
          cp GETTING-STARTED.md _site/
          cp README.md          _site/

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ABSuite — the black box for AI systems</title>
            <meta name="description" content="Record what your AI did, prove it happened, preserve the evidence. Ed25519-signed, hash-chained execution traces. Verify one in your browser — no install, no account.">
            <meta name="color-scheme" content="dark">
            <meta property="og:title" content="ABSuite — the black box for AI systems">
            <meta property="og:description" content="Record what happened. Prove it happened. Preserve the evidence.">
            <style>
              :root{
                --bg:#040706;--panel:#0A100E;--panel-2:#070C0A;
                --line:rgba(45,233,165,.16);--line-soft:rgba(45,233,165,.07);
                --fg:#E8F5F0;--muted:#7C9389;--dim:#4E635B;
                --em:#2DE9A5;--em-dim:#00B87A;
                --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
                --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
              }
              *{box-sizing:border-box}
              body{
                margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--sans);
                background-image:
                  radial-gradient(1000px 560px at 12% -12%,rgba(45,233,165,.09),transparent 60%),
                  radial-gradient(760px 460px at 96% 2%,rgba(45,233,165,.05),transparent 55%),
                  linear-gradient(var(--line-soft) 1px,transparent 1px),
                  linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
                background-size:auto,auto,46px 46px,46px 46px;background-attachment:fixed;
              }
              main{max-width:60rem;margin:0 auto;padding:3rem 1.25rem 5rem}
              .mast{display:flex;align-items:center;gap:.85rem;margin-bottom:4rem;flex-wrap:wrap}
              .glyph{width:40px;height:40px;flex:none;border:1.5px solid var(--em);border-radius:9px;
                display:grid;place-items:center;box-shadow:0 0 24px rgba(45,233,165,.25) inset,0 0 16px rgba(45,233,165,.25)}
              .glyph svg{width:21px;height:21px;stroke:var(--em);fill:none;stroke-width:1.7}
              .brand{font-weight:700;font-size:1.3rem;line-height:1}
              .brand small{display:block;font:600 .61rem/1 var(--mono);letter-spacing:.19em;
                color:var(--em);text-transform:uppercase;margin-top:.34rem}
              .rec{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;
                font:.63rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
                border:1px solid var(--line);border-radius:999px;padding:.42rem .85rem;background:var(--panel-2)}
              .rec i{width:7px;height:7px;border-radius:50%;background:var(--em);box-shadow:0 0 9px var(--em);
                animation:pulse 2.4s ease-in-out infinite}
              @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
              @media (prefers-reduced-motion:reduce){.rec i{animation:none}}
              h1{font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:.94;letter-spacing:-.04em;
                margin:0 0 1.4rem;font-weight:800;text-transform:uppercase}
              h1 .accent{color:var(--em)}
              .lede{font-size:1.22rem;margin:0 0 .8rem;max-width:40rem}
              .sub{color:var(--muted);max-width:42rem;margin:0 0 2.4rem}
              .cta-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.2rem}
              a.cta{display:inline-block;padding:.9rem 1.5rem;background:var(--em);color:#04120C;
                border-radius:9px;text-decoration:none;font-weight:700;box-shadow:0 0 26px rgba(45,233,165,.25)}
              a.cta:hover{background:#4BF0B4}
              a.ghost{display:inline-block;padding:.9rem 1.5rem;border:1px solid var(--line);
                border-radius:9px;text-decoration:none;font-weight:600;color:var(--fg);background:var(--panel)}
              a.ghost:hover{border-color:var(--em-dim);color:var(--em)}
              .no{color:var(--muted);font-size:.88rem;margin:0 0 3.4rem}
              pre{background:var(--panel-2);border:1px solid var(--line);padding:1.1rem 1.2rem;
                border-radius:10px;overflow-x:auto;font:13px/1.7 var(--mono);color:var(--fg)}
              pre .c{color:var(--em)}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;margin:2.6rem 0}
              .card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:1.15rem}
              .card b{display:block;font:600 .62rem/1 var(--mono);letter-spacing:.16em;
                text-transform:uppercase;color:var(--em);margin-bottom:.5rem}
              .card span{color:var(--muted);font-size:.89rem;line-height:1.5}
              h2{font:600 .68rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
                color:var(--em);margin:3.4rem 0 1.1rem}
              ul.links{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
              ul.links a{color:var(--fg);text-decoration:none;border-bottom:1px solid rgba(45,233,165,.22)}
              ul.links a:hover{color:var(--em);border-bottom-color:var(--em)}
              footer{margin-top:4rem;padding-top:1.7rem;border-top:1px solid var(--line);
                color:var(--muted);font-size:.85rem}
              .tag{font:.68rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
                color:var(--em);margin-top:1.3rem}
            </style>
          </head>
          <body>
            <main>
              <div class="mast">
                <span class="glyph" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
                </span>
                <span class="brand">ABSuite<small>AI Black Box Recorder</small></span>
                <span class="rec"><i></i> Recording</span>
              </div>

              <h1>Prove what your <span class="accent">AI actually did</span></h1>
              <p class="lede">Record what happened. Prove it happened. Preserve the evidence.</p>
              <p class="sub">Every action is Ed25519-signed and hash-chained, so anyone can check the
              record — including people with no reason to trust you. Payloads are hashed, never stored.</p>

              <div class="cta-row">
                <a class="cta" href="./verify.html">Verify a trace in your browser &rarr;</a>
                <a class="ghost" href="https://github.com/iamGodofall/ABSuite-core">Source on GitHub</a>
              </div>
              <p class="no">No install. No account. No server. The page loads a real signed trace,
              verifies it with WebCrypto, then lets you tamper with it and watch verification fail.</p>

              <pre><span class="c">npm install</span> @absuitecore/capkit
          <span class="c">npm install</span> @absuitecore/trust</pre>

              <h2>[ Questions it answers ]</h2>
              <div class="grid">
                <div class="card"><b>What happened</b><span>A signed, hash-chained trace of every real action.</span></div>
                <div class="card"><b>Who did it</b><span>The subject of the capability token that authorised it.</span></div>
                <div class="card"><b>Was it allowed</b><span>Scope checked before execution, not after.</span></div>
                <div class="card"><b>What backs it</b><span>Claims checked against sources: supported, unverified or contradicted.</span></div>
                <div class="card"><b>Was it altered</b><span>Chain verification names the first broken record.</span></div>
                <div class="card"><b>Can you re-run it</b><span>Replay compares a re-run against recorded hashes.</span></div>
              </div>

              <h2>[ A hash chain is not a signature ]</h2>
              <p style="color:var(--muted);max-width:44rem;margin:0">Hash-chaining proves a record was
              not edited afterwards. It does not prove <em style="color:var(--em);font-style:normal">who
              wrote it</em> — the operator being audited can build a valid chain containing anything.
              Ed25519 closes that: verification needs only the public key, and a public key cannot sign.</p>

              <h2>[ Read next ]</h2>
              <ul class="links">
                <li><a href="./GETTING-STARTED.md">Getting started</a> — library, HTTP API and Docker</li>
                <li><a href="./API.md">API reference</a> — every route, generated from source</li>
                <li><a href="./openapi.yaml">OpenAPI spec</a> — import it into your client</li>
                <li><a href="./ARCHITECTURE.md">Architecture</a> — how the pieces fit together</li>
                <li><a href="./PRINCIPLES.md">Principles</a> — what this project refuses to build</li>
                <li><a href="./SECURITY-MODEL.md">Security model</a> — threat model and defence in depth</li>
                <li><a href="https://www.npmjs.com/org/absuitecore">Packages on npm</a> — all seven, with provenance</li>
              </ul>

              <footer>
                <p>Evidence over opinion &middot; verification over confidence &middot; facts over scores
                &middot; confidence never determines truth.</p>
                <p class="tag">[ Trust must be verifiable ]</p>
              </footer>
            </main>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
