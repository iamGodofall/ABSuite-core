name: Deprecate a published version

# Publishing is irreversible; deprecation is how a bad version gets a warning
# attached to it after the fact. It runs here rather than from a laptop so it
# uses the same credential as the publish, leaves the same audit trail, and
# does not depend on whose machine happens to be logged in.
#
# Reversible: run again with an empty message to undeprecate.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Package and range, e.g. @absuitecore/cli@1.0.0 or "@absuitecore/capkit@<1.1.1"'
        type: string
        required: true
      message:
        description: 'Why. Leave blank to UNDEPRECATE.'
        type: string
        required: false
      dry_run:
        description: 'Print what would happen and stop'
        type: boolean
        default: true

jobs:
  deprecate:
    name: Attach a deprecation notice
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Confirm the credential works before touching anything
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Inputs go through `env`, never straight into the script. A deprecation
      # message naturally contains apostrophes — "'__dirname' is not defined" —
      # and interpolating that into a single-quoted shell string produces a
      # syntax error at best and an injection at worst.
      #
      # A typo in the spec silently deprecates nothing and reports success, so
      # resolve the package first and fail loudly when it does not exist.
      - name: Show which versions this matches
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPEC: ${{ inputs.spec }}
        run: |
          # Strip the version: everything after the last '@'. On a scoped name
          # with no version that '@' is the scope marker, so fall back.
          name="${SPEC%@*}"
          [ -z "$name" ] && name="$SPEC"

          echo "Package: $name"
          if ! npm view "$name" versions --json; then
            echo "::error::$name is not published"
            exit 1
          fi

      - name: Deprecate
        if: inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPEC: ${{ inputs.spec }}
          MESSAGE: ${{ inputs.message }}
        run: |
          npm deprecate "$SPEC" "$MESSAGE"
          {
            echo "### Done"
            echo ""
            echo "\`$SPEC\`"
            echo ""
            if [ -z "$MESSAGE" ]; then
              echo "Deprecation **removed**."
            else
              echo "> $MESSAGE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: inputs.dry_run != false
        env:
          SPEC: ${{ inputs.spec }}
          MESSAGE: ${{ inputs.message }}
        run: |
          {
            echo "### Dry run — nothing was changed"
            echo ""
            echo '```'
            echo "npm deprecate \"$SPEC\" \"$MESSAGE\""
            echo '```'
            echo ""
            echo "Re-run with **dry_run unchecked** to apply it."
          } >> "$GITHUB_STEP_SUMMARY"
